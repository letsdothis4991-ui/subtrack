name: Deploy web app
# Publishes the web version to GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/LAUNCH_GUIDE.md', 'docs/IMPROVEMENTS.md', 'docs/COMPETITOR_REVIEW.md', 'docs/CLOUD_SETUP.md', 'docs/STORE_LISTING.md', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The web app lives under /app/; the landing page and guides sit at the site root.
      - run: npx expo export --platform web --output-dir dist/app
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/app
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_PRIVACY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/privacy.html
      # Single-page app: serve index.html for deep links.
      - name: Landing page, cancellation guides and sitemap
        run: npx tsx scripts/build-site.ts dist
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          PLAY_URL: ${{ vars.PLAY_URL }}
      # Unknown paths (e.g. app deep links) fall back to the web app.
      - run: cp dist/app/index.html dist/404.html && touch dist/.nojekyll
      # Public privacy policy page (Play Console needs a URL).
      - run: npx -y marked@15.0.12 -i docs/PRIVACY.md -o dist/privacy-body.html && (echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SubTrack privacy policy</title><style>body{font:16px/1.6 system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#141414;background:#FAFAF7}</style>'; cat dist/privacy-body.html) > dist/privacy.html && rm dist/privacy-body.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
