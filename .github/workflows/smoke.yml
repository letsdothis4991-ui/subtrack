name: Android smoke test
# Runs the APK from an Android build on an emulator and pushes logs + a screenshot to the
# `smoke-logs` branch, so crashes can be diagnosed without a physical phone.
on:
  workflow_run:
    workflows: [Android build]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Android build run ID to test
        required: true

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: subtrack-apk
          path: apk
          run-id: ${{ github.event.inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./.github/scripts/smoke.sh
      - name: Publish logs to smoke-logs branch
        run: |
          cp -r out /tmp/out
          git config user.name "smoke-bot" && git config user.email "smoke-bot@users.noreply.github.com"
          git checkout --orphan smoke-logs
          git rm -rfq . && cp -r /tmp/out/* .
          git add -A && git commit -qm "Smoke test logs for ${{ github.sha }}"
          git push -f origin smoke-logs
