name: Android build
# Builds a test APK on every push to main, and a Play Store bundle (.aab).
# The bundle is signed with your upload key when these repository secrets exist:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Optional: ADMOB_ANDROID_APP_ID and EXPO_PUBLIC_ADMOB_BANNER_ID for live ads (test ads otherwise),
#           EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY for sync.
on:
  push:
    branches: [main]
    # Docs and test-script changes don't need a new 30-minute Android build.
    paths-ignore: ['docs/**', '**.md', 'scripts/**', 'assets/store/**', '.github/scripts/**', '.github/workflows/smoke.yml', '.github/workflows/pages.yml', '.github/workflows/ci.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_ID: ${{ secrets.EXPO_PUBLIC_ADMOB_BANNER_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_PRIVACY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/privacy.html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate native project
        run: npx expo prebuild --platform android --no-install
      - name: Build APK and bundle
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Sign bundle with upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          # Gradle already signed the bundle with the debug key. Play rejects a bundle with two
          # signatures, so strip that one before signing with the upload key.
          zip -q -d "$AAB" 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/*.EC' 'META-INF/MANIFEST.MF' || [ $? -eq 12 ]
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          jarsigner -keystore upload.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          rm upload.jks
          signers=$(keytool -printcert -jarfile "$AAB" | grep -c '^Signer #')
          echo "Bundle signers: $signers"
          [ "$signers" -eq 1 ] || { echo "::error::Expected exactly 1 signer, found $signers"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: subtrack-apk
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: subtrack-aab
          path: android/app/build/outputs/bundle/release/*.aab
